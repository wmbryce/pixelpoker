name: Deploy

on:
  push:
    branches: [master]

# The client is deployed by Cloudflare Pages' own Git integration; this workflow
# only ships the Worker + Durable Objects. See docs/cloudflare-deploy.md.
jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun --filter server test

      # An unset or misspelled variable would expand to an empty --var and
      # deploy a Worker whose CORS allowlist is empty, breaking quickplay and
      # the room-exists check with no failing step.
      - name: Require CLIENT_ORIGIN
        env:
          CLIENT_ORIGIN: ${{ vars.CLIENT_ORIGIN }}
        run: |
          if [ -z "$CLIENT_ORIGIN" ]; then
            echo "::error::CLIENT_ORIGIN repository variable is not set. Set it to the Pages origin (see docs/cloudflare-deploy.md) before deploying."
            exit 1
          fi

      - name: Deploy Worker
        working-directory: server
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # CLIENT_ORIGIN is passed explicitly so a deploy never reverts the
        # Worker's allowed origin to the localhost value in wrangler.jsonc.
        run: bunx wrangler deploy --var CLIENT_ORIGIN:"${{ vars.CLIENT_ORIGIN }}"
